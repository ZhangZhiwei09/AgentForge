x-backend: &backend
  image: agentforge-server:local
  build:
    context: ../../
    dockerfile: infra/docker/Dockerfile.server
  env_file:
    - path: ../../apps/server/.env
      required: false
    - path: ../../.env
      required: false
    - path: ../../apps/server-py/.env
      required: false
  environment: &backend-env
    DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/agentforge
    REDIS_URL: redis://redis:6379
    KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge-files
    INGESTION_ASYNC_ENABLED: "true"
    PORT: "8000"
  volumes:
    - knowledge_files:/app/data/knowledge-files

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforge
    ports: ["127.0.0.1:5434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "agentforge"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *backend
    profiles: ["app"]
    command: ["python", "-m", "src.database", "upgrade"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  server:
    <<: *backend
    profiles: ["app"]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  worker:
    <<: *backend
    profiles: ["app"]
    command: ["python", "-m", "src.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  customer-service:
    profiles: ["app"]
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.customer-service
    environment:
      SERVER_API_URL: http://server:8000
    ports: ["5173:80"]
    depends_on: [server]
  data-admin:
    profiles: ["app"]
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    environment:
      SERVER_API_URL: http://server:8000
    ports: ["5200:80"]
    depends_on: [server]
  ollama:
    profiles: ["search"]
    image: ollama/ollama:latest
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["ollama_data:/root/.ollama"]
  elasticsearch:
    profiles: ["search"]
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "false"
    ports: ["127.0.0.1:9200:9200"]
    volumes: ["es_data:/usr/share/elasticsearch/data"]
  pgadmin:
    profiles: ["tools"]
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentforge.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports: ["127.0.0.1:5050:80"]
    volumes: ["pgadmin_data:/var/lib/pgadmin"]
    depends_on: [db]
  jaeger:
    profiles: ["tools"]
    image: jaegertracing/all-in-one:latest
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes: ["jaeger_data:/tmp"]

volumes:
  pgdata:
  redis_data:
  knowledge_files:
  ollama_data:
  es_data:
  pgadmin_data:
  jaeger_data:
