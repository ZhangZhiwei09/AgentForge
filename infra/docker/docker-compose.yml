services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentforge
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@agentforge.io
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Ollama Embedding（本地向量模型）─────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Elasticsearch ──────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
      - "ELASTIC_USERNAME=elastic"
      - "ELASTIC_PASSWORD=changeme"
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q 'green\\|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Neo4j ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/agentforge123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p agentforge123 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Jaeger Tracing ──────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"   # Jaeger UI
      - "4318:4318"     # OTLP HTTP receiver
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    volumes:
      - jaeger_data:/tmp

  # ── Langfuse LLM Observability ─────────────────────────
  langfuse:
    image: ghcr.io/langfuse/langfuse:2
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/langfuse
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-langfuse-nextauth-secret-change-me-in-production}"
      SALT: "${LANGFUSE_SALT:-langfuse-salt-change-me}"
      ENCRYPTION_KEY: "${LANGFUSE_ENCRYPTION_KEY:-c664547df5d73957fb381ac93b8f2b60012866434866bb0bf8d855b573977795}"
      NEXTAUTH_URL: "http://localhost:3000"
      TELEMETRY_ENABLED: "false"
    depends_on:
      db:
        condition: service_started

  server:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.server
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/agentforge
      REDIS_URL: redis://redis:6379
    depends_on:
      - db
      - redis
    env_file:
      - ../../apps/server/.env

  # ── Code Execution Sandbox (build-only, not running) ─────
  sandbox:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.sandbox
    image: agentforge-sandbox:latest
    command: ["echo", "Sandbox image built"]

volumes:
  pgdata:
  pgadmin_data:
  redis_data:
  ollama_data:
  es_data:
  neo4j_data:
  neo4j_logs:
  jaeger_data:
