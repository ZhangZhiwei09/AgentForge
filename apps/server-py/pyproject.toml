[project]
name = "agentforge-server"
version = "0.0.1"
description = "AgentForge Python Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "anyio>=4.0",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "email-validator>=2.2",
    "passlib[bcrypt]>=1.7",
    "bcrypt>=4.0",
    "python-dotenv>=1.0",
    "python-jose[cryptography]>=3.3",
    "openai>=1.0",
    "httpx>=0.28",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pgvector>=0.3.0",
    "langfuse>=3.0.0",
    "langgraph-checkpoint-postgres>=3.1.1",
    "psycopg-binary>=3.3.4",
    "redis>=5.0",
    "mcp>=2.0.0",
    "python-multipart>=0.0.18",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "pillow>=11.0",
    "minio>=7.2",
    "arq>=0.26",
    "prometheus-client>=0.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "ruff>=0.9",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "fakeredis>=2.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
