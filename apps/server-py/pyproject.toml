[project]
name = "agentforge-server"
version = "0.0.1"
description = "AgentForge Python Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "email-validator>=2.2",
    "passlib[bcrypt]>=1.7",
    "python-jose[cryptography]>=3.3",
    "openai>=1.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pgvector>=0.3.0",
    "langfuse>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
