<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Direction 03 · Mobile Drawer</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#eef2f7}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,textarea{font:inherit}.phone{min-height:100vh;max-width:520px;margin:auto;background:#f8fafc;display:grid;grid-template-rows:58px minmax(0,1fr) 86px;box-shadow:0 0 48px #17203314}.top{display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid #e0e6ee}.top button{border:0;background:#eef4ff;color:#2167e8;border-radius:10px;width:34px;height:34px;cursor:pointer}.top b{font-size:14px}.top span{display:block;color:#8491a3;font-size:11px;margin-top:3px}.messages{overflow:auto;padding:18px 15px}.msg{display:flex;gap:8px;margin:15px 0}.msg.user{justify-content:flex-end}.avatar{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:#2167e8;color:#fff;font-size:10px;font-weight:800;flex:none}.user .avatar{background:#dbe7fb;color:#2167e8;order:2}.bubble{max-width:82%;padding:11px 13px;border:1px solid #e0e6ee;background:#fff;border-radius:14px 14px 14px 4px;font-size:13px;line-height:1.6}.user .bubble{background:#2167e8;border:0;color:#fff;border-radius:14px 14px 4px 14px}.bubble small{display:block;font-size:10px;color:#2167e8;margin-bottom:4px}.user .bubble small{color:#dbe7fb}.composer{display:flex;gap:8px;align-items:end;padding:12px;background:#fff;border-top:1px solid #e0e6ee}.composer textarea{min-height:42px;max-height:92px;resize:none;flex:1;border:1px solid #dce4ee;border-radius:12px;padding:10px 11px;outline:0}.composer textarea:focus{border-color:#2167e8}.send{border:0;background:#2167e8;color:#fff;border-radius:11px;padding:11px 13px;font-weight:700;cursor:pointer}.drawer{position:fixed;inset:0;z-index:10;background:#17203333;opacity:0;pointer-events:none;transition:.2s}.drawer.open{opacity:1;pointer-events:auto}.panel{width:min(320px,86vw);height:100%;background:#fff;padding:18px 14px;transform:translateX(-100%);transition:.25s;box-shadow:14px 0 30px #1720331c}.drawer.open .panel{transform:none}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.panel-head b{font-size:15px}.close{border:0;background:#f0f3f8;border-radius:9px;width:32px;height:32px;cursor:pointer}.new{width:100%;border:0;border-radius:10px;background:#2167e8;color:#fff;padding:11px;font-weight:700;cursor:pointer}.item{width:100%;display:block;text-align:left;border:0;background:transparent;padding:12px 10px;border-radius:10px;margin-top:7px;cursor:pointer}.item:hover,.item.active{background:#eef4ff;color:#2167e8}.item b{display:block;font-size:12px}.item span{display:block;color:#8c99ab;font-size:10px;margin-top:4px}.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(8px);background:#172033;color:#fff;border-radius:10px;padding:10px 13px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(min-width:700px){.phone{margin:26px auto;min-height:calc(100vh - 52px);border-radius:22px;overflow:hidden}}
  </style>
</head>
<body>
  <div class="phone"><header class="top"><button id="menu" aria-label="会话列表">☰</button><div><b>核身排障助手</b><span>在线 · FACE_TIMEOUT 排查</span></div></header><main class="messages" id="messages"><div class="msg"><div class="avatar">AI</div><div class="bubble"><small>诊断助手</small>你可以先告诉我：问题发生在哪个设备、哪个步骤，以及是否可以稳定复现？</div></div><div class="msg user"><div class="bubble"><small>你</small>部分安卓设备活体检测超时，第二次重试有时会通过。</div><div class="avatar">我</div></div><div class="msg"><div class="avatar">AI</div><div class="bubble"><small>诊断助手</small>明白了。请补充失败设备型号，我会把排查路径缩小到相机初始化和网络超时两个分支。</div></div></main><footer class="composer"><textarea id="input" rows="1" placeholder="继续描述问题..."></textarea><button class="send" id="send">发送</button></footer></div>
  <div class="drawer" id="drawer"><aside class="panel"><div class="panel-head"><b>会话</b><button class="close" id="close">×</button></div><button class="new" id="new">＋ 新对话</button><button class="item active"><b>FACE_TIMEOUT 排查</b><span>刚刚 · 4 条消息</span></button><button class="item"><b>SDK 版本升级建议</b><span>昨天 · 8 条消息</span></button><button class="item"><b>摄像头权限问题</b><span>周一 · 6 条消息</span></button></aside></div><div class="toast" id="toast"></div>
  <script>
    const drawer=document.querySelector('#drawer'),messages=document.querySelector('#messages'),input=document.querySelector('#input'),toast=document.querySelector('#toast');function notify(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1400)}
    document.querySelector('#menu').onclick=()=>drawer.classList.add('open');document.querySelector('#close').onclick=()=>drawer.classList.remove('open');drawer.onclick=e=>{if(e.target===drawer)drawer.classList.remove('open')};document.querySelector('#new').onclick=()=>{drawer.classList.remove('open');notify('已创建新对话')};document.querySelectorAll('.item').forEach(i=>i.onclick=()=>{document.querySelectorAll('.item').forEach(x=>x.classList.remove('active'));i.classList.add('active');drawer.classList.remove('open');notify('已切换会话')});
    function send(){const t=input.value.trim();if(!t)return;messages.insertAdjacentHTML('beforeend','<div class="msg user"><div class="bubble"><small>你</small>'+t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</div><div class="avatar">我</div></div>');input.value='';messages.scrollTop=messages.scrollHeight;setTimeout(()=>{messages.insertAdjacentHTML('beforeend','<div class="msg"><div class="avatar">AI</div><div class="bubble"><small>诊断助手</small>收到，我会继续沿着当前问题上下文分析。</div></div>');messages.scrollTop=messages.scrollHeight},450)}
    document.querySelector('#send').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  </script>
</body>
</html>
