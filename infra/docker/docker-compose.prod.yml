x-backend: &backend
  image: agentforge-server:latest
  build:
    context: ../../
    dockerfile: infra/docker/Dockerfile.server
  environment: &backend-env
    APP_ENV: production
    DEBUG: "false"
    AUTH_SIGNUP_ENABLED: "false"
    ANONYMOUS_CHAT_ENABLED: "false"
    PUBLIC_FAQ_ENABLED: "false"
    DATABASE_URL: ${DATABASE_URL:?Set the PostgreSQL URL using host db and port 5432}
    REDIS_URL: ${REDIS_URL:?Set the authenticated Redis URL using host redis}
    JWT_SECRET: ${JWT_SECRET:?Set a stable JWT signing secret}
    OPENAI_API_KEY: ${OPENAI_API_KEY:?Set the model provider credential}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o-mini}
    EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
    ELASTICSEARCH_URL: ${ELASTICSEARCH_URL:-}
    RERANKER_BASE_URL: ${RERANKER_BASE_URL:-}
    RERANKER_MODEL: ${RERANKER_MODEL:-}
    PGVECTOR_ENABLED: "true"
    KNOWLEDGE_STORAGE_ROOT: /app/data/knowledge-files
    INGESTION_ASYNC_ENABLED: "true"
    RATE_LIMIT_REDIS_ENABLED: "true"
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    # The API is reachable only on the private Compose network.
    FORWARDED_ALLOW_IPS: ${TRUSTED_PROXY_IPS:-*}
    LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-false}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    TAVILY_API_KEY: ${TAVILY_API_KEY:-}
    PORT: "8000"
  volumes:
    - knowledge_files:/app/data/knowledge-files

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agentforge}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *backend
    command: ["python", "-m", "src.database", "upgrade"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
  server:
    <<: *backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  worker:
    <<: *backend
    command: ["python", "-m", "src.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  customer-service:
    image: agentforge-customer-service:latest
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.customer-service
    environment:
      SERVER_API_URL: http://server:8000
    ports: ["${WEB_PORT:-80}:80"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
  data-admin:
    image: agentforge-data-admin:latest
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.web
    environment:
      SERVER_API_URL: http://server:8000
    ports: ["${ADMIN_PORT:-5200}:80"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy

volumes:
  pgdata:
  redis_data:
  knowledge_files:
